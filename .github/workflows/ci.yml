name: CI

# Build + test gate. Runs on every PR and on pushes to the long-lived branches.
on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Xcode is pinned for deterministic, drift-free runs (see ci spec: "CI is
# deterministic across reruns"). iOS 26 requires Xcode 26, present only on recent
# macOS runner images — adjust `runs-on`/`XCODE_VERSION` if GitHub's images change.
# The simulator device is chosen at runtime by Scripts/ios-test.sh (newest iPhone).
env:
  XCODE_VERSION: "26.0"

jobs:
  core-tests:
    name: Core library (swift test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Run package tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee swift-test.log

      - name: Assert tests actually ran
        run: Scripts/assert-tests-ran.sh swift-test.log

  ios-build-test:
    name: iOS app (xcodebuild test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install XcodeGen
        run: brew install xcodegen

      # Generates the project, selects the newest available iPhone simulator,
      # runs the tests, and asserts a non-empty suite. Shared with local dev.
      - name: Build & test (iOS Simulator)
        run: Scripts/ios-test.sh
